<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>Sente</title></head>
<body>
  <header><span class="mark" aria-hidden="true">↗</span><h1 data-i18n="heading"></h1></header>
  <p data-i18n="intro"></p>
  <div id="status" role="status" aria-live="polite"></div>
  <p id="count"></p>
  <ul id="tabs" aria-label="Shared tabs"></ul>
  <button id="share" data-i18n="share"></button>
  <button id="stop" class="secondary" data-i18n="stop"></button>
  <p id="error" role="alert"></p>
  <a id="feedback" class="feedback" href="https://teai.io/browser-feedback" target="_blank" rel="noopener noreferrer" data-i18n="feedback"></a>
  <p class="feedback-note" data-i18n="feedbackNote"></p>
  <footer data-i18n="boundary"></footer>
  <nav><a href="https://yukihamada.github.io/sente-browser/#install" target="_blank" rel="noopener" data-i18n="help"></a> · <a href="https://yukihamada.github.io/sente-browser/privacy.html" target="_blank" rel="noopener" data-i18n="privacy"></a></nav>
  <script src="popup.js"></script>
</body>
</html>
